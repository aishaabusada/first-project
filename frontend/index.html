<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 1000px;">
        
        <div class="row g-3 mb-4 text-center">
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <span class="text-muted mb-1">Total</span>
                    <h3 id="total-amount" class="fw-bold">0.00</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <span class="text-muted mb-1">Number of expenses</span>
                    <h3 id="expenses-count" class="fw-bold">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <span class="text-muted mb-1">Highest expense</span>
                    <h3 id="highest-expense" class="fw-bold">0.00</h3>
                    <small id="highest-category" class="text-muted">-</small>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Add expense</h5>
                <form id="expense-form">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label text-muted small">Title</label>
                            <input type="text" id="title" class="form-control" placeholder="Lunch" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted small">Amount</label>
                            <input type="number" step="0.01" id="amount" class="form-control" placeholder="4.50" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted small">Category</label>
                            <select id="category" class="form-select" required>
                                <option value="" disabled selected>Choose...</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Bills">Bills</option>
                                <option value="Groceries">Groceries</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted small">Date</label>
                            <input type="date" id="date" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Add expense</button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="card-title m-0">Expenses</h5>
                    <div class="d-flex align-items-center">
                        <label class="me-2 text-muted small">Category</label>
                        <select id="filter-category" class="form-select form-select-sm" style="width: 150px;" onchange="filterExpenses()">
                            <option value="All">All</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Bills">Bills</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Amount</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="expenses-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/expenses';
        let allExpenses = [];

        async function fetchExpenses() {
            try {
                const response = await fetch(API_URL);
                allExpenses = await response.json();
                updateUI(allExpenses);
            } catch (error) {
                console.error('Error fetching expenses:', error);
            }
        }

        function updateUI(expenses) {
            const tbody = document.getElementById('expenses-table-body');
            tbody.innerHTML = '';

            let total = 0;
            let highest = 0;
            let highestCat = '-';

            expenses.forEach(expense => {
                const amt = parseFloat(expense.amount);
                total += amt;

                if (amt > highest) {
                    highest = amt;
                    highestCat = expense.category;
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="fw-semibold">${expense.title}</td>
                    <td>${amt.toFixed(2)}</td>
                    <td><span class="badge bg-success">${expense.category}</span></td>
                    <td>${new Date(expense.date).toISOString().split('T')[0]}</td>
                    <td class="text-end">
                        <button onclick="deleteExpense(${expense.id})" class="btn btn-outline-danger btn-sm">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('total-amount').innerText = total.toFixed(2);
            document.getElementById('expenses-count').innerText = expenses.length;
            document.getElementById('highest-expense').innerText = highest > 0 ? highest.toFixed(2) : '0.00';
            document.getElementById('highest-category').innerText = highestCat;
        }

        function filterExpenses() {
            const selectedCategory = document.getElementById('filter-category').value;
            if (selectedCategory === 'All') {
                updateUI(allExpenses);
            } else {
                const filtered = allExpenses.filter(exp => exp.category === selectedCategory);
                updateUI(filtered);
            }
        }

        document.getElementById('expense-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newExpense = {
                title: document.getElementById('title').value,
                amount: document.getElementById('amount').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newExpense)
                });

                if (response.ok) {
                    document.getElementById('expense-form').reset();
                    fetchExpenses();
                }
            } catch (error) {
                console.error('Error adding expense:', error);
            }
        });

        async function deleteExpense(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    fetchExpenses();
                }
            } catch (error) {
                console.error('Error deleting expense:', error);
            }
        }

        fetchExpenses();
    </script>

</body>
</html>
